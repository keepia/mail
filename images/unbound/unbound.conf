# Default configuration of the Keepia Unbound image (ghcr.io/keepia/mail-unbound).
# The Compose template (#5 part 3) mounts each role's own file over it,
# with the container's private address as the interface.
#
# 0.1.0 recurses nowhere (#5 plan, N3): every name outside the local zone
# is refused, so no query leaves the host. Recursion through an egress
# network comes with 0.3.0, when root DNS is approved.
server:
	# Already non-root (uid 10053): no user switch and no chroot, which
	# would need capabilities the container does not have.
	username: ""
	chroot: ""
	directory: "/etc/unbound"
	pidfile: ""
	do-daemonize: no
	use-syslog: no
	logfile: ""
	log-time-ascii: yes
	verbosity: 1

	interface: 127.0.0.1
	port: 53
	access-control: 127.0.0.0/8 allow

	# No validator: nothing is resolved, so there is nothing to validate,
	# and no trust anchor file is needed.
	module-config: "iterator"

	local-zone: "." refuse
	# The local zone a health probe can ask (RFC 2606 .invalid, RFC 5737
	# address).
	local-zone: "health.keepia.invalid." static
	local-data: "health.keepia.invalid. 60 IN A 192.0.2.53"

remote-control:
	# unbound-control over a unix socket: the health check and the reload
	# watcher's `unbound-control reload`. No TLS keys for a local socket.
	control-enable: yes
	control-interface: /run/unbound/control.sock
	control-use-cert: no
