# Keepia Mail, store role: Dovecot 2.4 holding the mailboxes (#2 sections 2
# and 8, #5 plan "Compose template"). It replaces the image's
# /etc/dovecot/dovecot.conf wholesale; the image's vendor.d (rootless
# ports, doveadm and stats HTTP listeners on 8080 and 9090) is not
# included.
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.0

# listen = the container's store-private address, from the Compose file
# (R-BIND-PRIVATE; Dovecot expands no environment variable in listen).
!include /etc/dovecot/keepia-listen.conf

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

# The image's only user (rootless, uid 1000).
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail

protocols = imap lmtp

# Only on the internal store-private network, never published: the edge
# reaches it through the gate from 0.2.0 on.
ssl = no
auth_allow_cleartext = yes

# Mail on the named volume store-mail, mounted at exactly /srv/vmail (the
# image's VOLUME; #2 section 8). Maildir++ with "\" as the escape
# character, as mailcow writes it (#4).
mail_driver = maildir
mail_path = ~/Maildir
mail_home = /srv/vmail/%{user | domain}/%{user | username}
mailbox_list_layout = maildir++
mailbox_list_storage_escape_char = "\\"
mail_uid = vmail
mail_gid = vmail

# Indexes are rebuildable and live on their own named volume, store-index
# (#2 section 8). It is mounted at /var/lib/dovecot, the one path of the
# image that belongs to vmail, so the empty volume starts writable by it.
mail_index_path = /var/lib/dovecot/index/%{user | domain}/%{user | username}

# Users: a passwd-file on the named volume store-users, empty in the
# template (the agent writes it from 0.2.0 on).
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users/users.passwd
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users/users.passwd
}

service imap-login {
  # No chroot: the container has SYS_CHROOT only in its bounding set and
  # runs with no-new-privileges (coordinator decision C13).
  chroot =
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service pop3-login {
  chroot =
}

service submission-login {
  chroot =
}

service managesieve-login {
  chroot =
}

service anvil {
  chroot =
}
