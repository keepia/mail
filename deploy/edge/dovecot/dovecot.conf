# Keepia Mail, edge role: Dovecot 2.4 as the IMAP and LMTP proxy in front
# of the stores (#2 sections 2 and 8, #5 plan "Compose template"). It
# replaces the image's /etc/dovecot/dovecot.conf wholesale; the image's
# vendor.d (rootless ports, doveadm and stats HTTP listeners) is not
# included.
#
# 0.1.0 has no routing data yet (the agent and keepia-edge come with
# 0.2.0), so the only passdb answers every lookup with a temporary failure:
# LMTP RCPT gets 451 4.3.0 and IMAP LOGIN gets NO [UNAVAILABLE]
# (R-REPLICA-ATOMIC, R-EDGE-UNKNOWN-4XX; #5 plan M17). Mail is deferred,
# never bounced.
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.0

# listen = the container's edge-private address, from the Compose file
# (R-BIND-PRIVATE; Dovecot expands no environment variable in listen).
!include /etc/dovecot/keepia-listen.conf

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

# The image's only user (rootless, uid 1000).
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail

protocols = imap lmtp

# Only on the internal edge-private network, never published (N1): TLS
# for clients comes with the certificates in a later milestone.
ssl = no
auth_allow_cleartext = yes

# A routing change must take effect at the next login: no auth cache.
auth_cache_size = 0
lmtp_proxy = yes

passdb lua {
  lua_file = /etc/dovecot/keepia-tempfail.lua
}

# No mail_* settings: the edge stores no mail (R-EDGE-NO-STORAGE). The
# image's VOLUME /srv/vmail is the named volume edge-vmail, which stays
# empty (#5 plan, test 11).

service imap-login {
  # No chroot: the container has SYS_CHROOT only in its bounding set and
  # runs with no-new-privileges (coordinator decision C13).
  chroot =
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service pop3-login {
  chroot =
}

service submission-login {
  chroot =
}

service managesieve-login {
  chroot =
}

service anvil {
  chroot =
}
