# Keepia Mail, filter role: olefy (oletools) for Office attachments. olefy
# has no authentication, so it sits on the internal network filter-olefy,
# where rspamd is its only client (#44 note on #26). Its address comes from
# the Compose file (RSPAMD_OLEFY_SERVER, read here as env.OLEFY_SERVER).
oletools {
  servers = "{= env.OLEFY_SERVER =}";
  # olefy's container has a 256 MiB memory limit and a 32 MiB /tmp: one
  # 20 MB attachment already needs most of it (#44, measured), so larger
  # parts are not sent.
  max_size = 10000000;
  timeout = 15s;
}
