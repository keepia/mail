# Keepia Mail, filter role: clamd (filter-clamd) scans attachments. Its
# address comes from the Compose file (RSPAMD_CLAMD_SERVER, read here as
# env.CLAMD_SERVER). No action is forced in 0.1.0: the result is a symbol.
clamav {
  type = "clamav";
  servers = "{= env.CLAMD_SERVER =}";
  symbol = "CLAM_VIRUS";
  scan_mime_parts = true;
  max_size = 20000000;
}
