# #49 point 4 (review A finding 3): each test step comes right after a
# verify step and has the verified image ID in its env, and names
# $VERIFIED_IMAGE, but tests something else: make image-test (the
# Makefile's tag), the ID as the name argument, or a tag. f360066 only
# looked for the variable's name anywhere in the step. The last step is
# the repository's form and is not reported.
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BAKE_TARGET: postfix
      PLATFORM: linux/amd64
    steps:
      - run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -build "$BAKE_TARGET" -build-set "$BAKE_SET"
      - id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          load: true
      - id: verify
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - env:
          VERIFIED_IMAGE: ${{ steps.verify.outputs.image }}
        run: test -n "$VERIFIED_IMAGE" && make image-test IMAGE=postfix VERSION=dev
      - id: verify2
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - env:
          VERIFIED_IMAGE: ${{ steps.verify2.outputs.image }}
        run: bash scripts/image-test.sh "$VERIFIED_IMAGE" postfix
      - id: verify3
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - env:
          VERIFIED_IMAGE: ${{ steps.verify3.outputs.image }}
        run: |
          echo "testing $VERIFIED_IMAGE"
          bash scripts/image-test.sh postfix ghcr.io/keepia/mail-postfix:dev
      - id: verify4
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - env:
          VERIFIED_IMAGE: ${{ steps.verify4.outputs.image }}
        run: bash scripts/image-test.sh postfix "$VERIFIED_IMAGE"
