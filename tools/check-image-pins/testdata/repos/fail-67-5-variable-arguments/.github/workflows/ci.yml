# #68 review B, B1: a top-level call that passes the arguments to a
# forwarding function in a form other than "$@"/"$N":
# - portable.sh: the portable idiom ${1+"$@"};
# - at.sh: ${@+"$@"};
# - first.sh: "${1?msg}";
# - options.sh: an array copy after option parsing, "${args[@]}";
# - joined.sh: a variable that holds them, cmd="$*" and $cmd.
# Each runs make publish, and publish pushes by tag with no verify step
# before it. Each call is reported like top-level forwarding.
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BAKE_TARGET: postfix
      PLATFORM: linux/amd64
    steps:
      - run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -build "$BAKE_TARGET" -build-set "$BAKE_SET"
      - id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          load: true
      - run: sh scripts/portable.sh make publish
      - run: sh scripts/at.sh make publish
      - run: sh scripts/first.sh make
      - run: bash scripts/options.sh -n 2 make publish
      - run: sh scripts/joined.sh make publish
