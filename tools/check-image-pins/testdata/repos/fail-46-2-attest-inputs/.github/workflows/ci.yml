# #46 point 2 (review A delta 3, finding 2): bake-action's sbom and
# provenance inputs become --sbom and --provenance, which build mode never
# resolves; a generator image in them would run unpinned during the build.
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BAKE_TARGET: postfix
      PLATFORM: linux/amd64
    steps:
      - run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -build "$BAKE_TARGET" -build-set "$BAKE_SET"
      - id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          load: true
          sbom: generator=docker.io/attacker/scanner:latest
          provenance: mode=max,builder-id=x
