# #49 point 3 (review A finding 2, review B finding 2): builds the matcher
# missed at f360066: a list split over lines as black and gofmt write it,
# in a step and in a Go file a step runs, and actions/github-script,
# whose script was never read, on one line and split over lines.
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - shell: python
        run: |
          import subprocess

          subprocess.run(
              [
                  "docker",
                  "build",
                  ".",
              ],
              check=True,
          )
      - run: go run tools/build.go
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: await exec.exec('docker', ['build', '.'])
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await exec.exec(
              'docker',
              [
                'buildx',
                'bake',
              ],
            )
