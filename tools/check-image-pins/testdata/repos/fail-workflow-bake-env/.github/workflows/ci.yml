# The shared form, steered through env: a BUILDX_ variable and a bake
# variable at workflow and job level, a BAKE_SET line that sets named
# contexts, a check step that can be skipped, and a run step that calls
# bake itself.
on: pull_request
permissions:
  contents: read
env:
  BUILDX_BAKE_FILE: ci-alt.hcl
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BAKE_TARGET: app
      CTX: https://example.invalid/x.git
      BAKE_SET: |
        app.cache-from=type=gha,scope=app
        app.contexts.base=docker-image://busybox:latest
        ${{ matrix.attr }}=x
    steps:
      - run: docker buildx bake -f ci-alt.hcl --print app
      - run: make image-pins-build
        if: false
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          set: ${{ env.BAKE_SET }}
