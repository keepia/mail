# The repository's docker-build shape: one job-level definition of the
# build's inputs, the build-mode check right before the build, and the
# verify step right before every step that tests or saves the image.
on: pull_request
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [root, a]
        arch: [amd64, arm64]
    env:
      BAKE_TARGET: ${{ matrix.image }}
      PLATFORM: linux/${{ matrix.arch }}
      BAKE_SET: |
        ${{ matrix.image }}.cache-from=type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        ${{ matrix.image }}.cache-to=${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}-{1}', matrix.image, matrix.arch) || '' }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: go run ./tools/check-image-pins -build "$BAKE_TARGET" -build-set "$BAKE_SET"
      - name: Build
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          load: true
          set: ${{ env.BAKE_SET }}
      - env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: go run ./tools/check-image-pins -verify-built
      - name: Test
        env:
          IMAGE: ${{ matrix.image }}
        run: make image-test IMAGE="$IMAGE"
      - if: matrix.arch == 'amd64'
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: go run ./tools/check-image-pins -verify-built
      - if: matrix.arch == 'amd64'
        run: docker save "ghcr.io/keepia/$BAKE_TARGET:dev" | zstd -q -o image.tar.zst
