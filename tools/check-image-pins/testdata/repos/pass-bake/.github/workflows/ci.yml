# The repository's docker-build shape: one job-level definition of the
# build's inputs, the build-mode check right before the build, the verify
# step right before the test, which runs the verified image ID, and the
# save through verify's own -save.
on: pull_request
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [root, a]
        arch: [amd64, arm64]
    env:
      BAKE_TARGET: ${{ matrix.image }}
      PLATFORM: linux/${{ matrix.arch }}
      BAKE_SET: |
        ${{ matrix.image }}.cache-from=type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        ${{ matrix.image }}.cache-to=${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}-{1}', matrix.image, matrix.arch) || '' }}
    steps:
      - run: sh scripts/ci-docker-mirror.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -build "$BAKE_TARGET" -build-set "$BAKE_SET"
      - name: Build
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          load: true
          set: ${{ env.BAKE_SET }}
      - id: verify
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - name: Test
        env:
          IMAGE: ${{ matrix.image }}
          VERIFIED_IMAGE: ${{ steps.verify.outputs.image }}
        run: bash scripts/image-test.sh "$IMAGE" "$VERIFIED_IMAGE"
      - if: matrix.arch == 'amd64'
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built -save "$RUNNER_TEMP/image.tar"
