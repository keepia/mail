# #50 review B finding 1: make forms whose push ae164e4 dropped, each
# after the build with no verify step before it: a recipe line inside
# ifeq, a prerequisite whose rule is in an included *.mk, a define canned
# recipe, .DEFAULT_GOAL, and a prerequisite only a pattern rule makes.
# Each Makefile pushes by tag.
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BAKE_TARGET: postfix
      PLATFORM: linux/amd64
    steps:
      - run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -build "$BAKE_TARGET" -build-set "$BAKE_SET"
      - id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          load: true
      - run: make -C mk/cond publish-cond CI=true
      - run: make -C mk/prereq publish-prereq
      - run: make -C mk/define publish-define
      - run: make -C mk/goal
      - run: make -C mk/pattern publish-pattern
