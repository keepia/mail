# #67: the other spellings of forwarding through a function. wrap.sh
# passes "${@}" to a wrapper that runs "${@}"; first.sh passes "$1" to a
# function that runs "$1" (make, whose default goal is publish); star.sh
# passes "$*" to a function that runs $1 after $SUDO. publish runs
# scripts/publish.sh, which pushes by tag with no verify step before it.
# Each top-level call is reported like top-level forwarding, naming the
# argument it passes.
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BAKE_TARGET: postfix
      PLATFORM: linux/amd64
    steps:
      - run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -build "$BAKE_TARGET" -build-set "$BAKE_SET"
      - id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          load: true
      - run: bash scripts/wrap.sh make publish
      - run: sh scripts/first.sh make
      - run: sh scripts/star.sh make publish
