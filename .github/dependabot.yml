# cooldown: Dependabot waits 14 days after a release before it proposes the
# version update (see docs/development/index.md, "Security checks").
# It applies to version updates only; security updates are exempt.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 14
  # Base images and the # syntax frontend of the own images (tag and digest
  # together). Each image directory is listed: images/common has no
  # Dockerfile. A new image adds its directory.
  - package-ecosystem: docker
    directories: ["/", "/images/postfix", "/images/unbound"]
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 14
  # The upstream images of the Compose template (docker-compose.yml, tag
  # and digest together; #5 part 3). A PostgreSQL major version needs a
  # dump and restore, so it is not proposed (as in mail-archive).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
