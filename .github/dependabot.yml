# cooldown: Dependabot waits 14 days after a release before it proposes the
# version update (see docs/development/index.md, "Security checks").
# It applies to version updates only; security updates are exempt.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 14
