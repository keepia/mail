name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request run cancels the older run of the same pull request (its group
# is the PR ref). A push to main gets a group of its own per commit and is never
# cancelled, so every merge gets a complete CI result, also when the next merge
# follows seconds later (the same rule as secrets.yml).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every relative Markdown link and heading anchor resolves
  # (scripts/check-links.sh), after the check's self-test.
  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make links-test links

  # actionlint on all workflows (actionlint pinned in the Makefile, verified
  # through the Go checksum database), every `uses:` pinned to a full commit
  # SHA with a version comment (tools/check-action-pins, a YAML parser, after
  # its tests), and a valid .github/labels.json.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make workflows-test workflows

  # Go tests against a throwaway PostgreSQL. In CI (CI is set) the database
  # tests fail instead of skipping when TEST_DATABASE_URL is missing
  # (internal/store/storetest), so this job cannot pass with them skipped.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The runner pulls service images before any step: the image is
        # named on mirror.gcr.io (Google's public Docker Hub cache) directly.
        # Pinned by digest like every image (tools/check-image-pins); the
        # same digest as Docker Hub's postgres:18.6-trixie (#5 plan).
        image: mirror.gcr.io/library/postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: keepia
          POSTGRES_PASSWORD: keepia
          POSTGRES_DB: keepia
        # Random host port on loopback; the test step reads it below.
        ports: ["127.0.0.1::5432"]
        options: >-
          --health-cmd "pg_isready -U keepia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      # Random test order (-shuffle=on): a failure prints its seed as
      # -test.shuffle N; rerun it with go test -shuffle=N.
      - run: go test -race -shuffle=on -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://keepia:keepia@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/keepia?sslmode=disable

  # golangci-lint (.golangci.yml) at the version the Makefile pins.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Go toolchain check that the Dockerfile runs, with its own tests
      # (scripts/check-go-toolchain.sh, byte-identical with mail-archive).
      - run: sh scripts/check-go-toolchain-test.sh
      # The shell scripts that are tested without Docker: check-source with
      # source-listing.sh, the SOGo stop wrapper keepia-sogod (#55), the
      # edge address guard (#61) and test 7's km failure cause (#69).
      - run: make image-scripts-test
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  # govulncheck (pinned in the Makefile, verified through the Go checksum
  # database) on all packages.
  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln

  # The own images (docker-bake.hcl), one row per image and platform, each on
  # a native GitHub-hosted runner (no QEMU). A row builds its image into the
  # runner's Docker store, then runs scripts/image-test.sh: the smoke command,
  # the package list, user and capabilities, the healthcheck green and red,
  # for Postfix and Unbound the reload watcher, for olefy a scan, and for SOGo
  # sogod's start without a database. CI never logs in to a
  # registry and never pushes; release.yml (#5 part 4) is the only publisher.
  docker-build:
    name: docker-build (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Room for a cold build without the layer cache.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [keepia, postfix, unbound, olefy, sogo]
        arch: [amd64, arm64]
    # The build's bake inputs, defined once for the check step and the Build
    # step (tools/check-image-pins rule 5 allows no other env here and
    # requires both steps to read these):
    # - BAKE_TARGET: the target;
    # - PLATFORM: the bake variable for the platform (it only sets
    #   platforms);
    # - BAKE_SET: the layer cache in the GitHub Actions cache, one scope per
    #   image and platform. Only pushes to main write it (mode=max: every
    #   stage; mode=min for sogo, whose build stage holds the compiler and
    #   the whole SOPE and SOGo build, #5 plan), so pull requests cannot
    #   crowd main's entries out of the 10 GB cache; on a pull request
    #   cache-to is empty, which exports nothing.
    env:
      BAKE_TARGET: ${{ matrix.image }}
      PLATFORM: linux/${{ matrix.arch }}
      BAKE_SET: |
        ${{ matrix.image }}.cache-from=type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        ${{ matrix.image }}.cache-to=${{ github.event_name == 'push' && format('type=gha,mode={2},scope={0}-{1}', matrix.image, matrix.arch, matrix.image == 'sogo' && 'min' || 'max') || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sh scripts/ci-docker-mirror.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit in the builder container pulls the base images and the
          # # syntax frontend through the mirror, with Docker Hub as the
          # fallback.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # Layer timestamps from the commit, so a rebuild of the same commit
      # gives the same layers where the inputs are the same. The check
      # allows no other GITHUB_ENV or GITHUB_PATH write in this job (the
      # mirror script's DOCKER_CONFIG aside).
      - name: Commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      # Rule 5 in build mode: resolves exactly what the next step builds
      # (BAKE_TARGET, BAKE_SET and this job's environment, including what
      # earlier steps wrote to GITHUB_ENV) and checks it, the cache
      # included (only type=gha with this row's scope). The check requires
      # this exact command right before Build. GOENV=off
      # GOFLAGS=-mod=readonly GOWORK=off: the tool is built from the module
      # and the checked module cache alone (no vendor/ directory), whatever
      # the job's environment or working tree holds.
      - run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -build "$BAKE_TARGET" -build-set "$BAKE_SET"
      # bake-action exposes the GitHub Actions cache runtime to BuildKit; a
      # plain `docker buildx bake` in a run step could not use type=gha.
      - name: Build
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ env.BAKE_TARGET }}
          load: true
          set: ${{ env.BAKE_SET }}
      # The image tested and the image saved are the checked build's output:
      # the local image ID must equal the digest in the build's metadata.
      # The check requires this step right before every step that tests,
      # saves, pushes or tags the image. It puts out the verified image ID
      # (steps.verify.outputs.image), and the test runs that ID, so a
      # re-tag after this step cannot change what is tested.
      - id: verify
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - name: Smoke, health and reload tests
        env:
          IMAGE: ${{ matrix.image }}
          VERIFIED_IMAGE: ${{ steps.verify.outputs.image }}
        run: bash scripts/image-test.sh "$IMAGE" "$VERIFIED_IMAGE"
      # The compose job loads the amd64 images from here instead of
      # building them again. Verify saves the image itself and checks the
      # tar it wrote (every blob, and the build's config under every name)
      # before it moves it to image.tar.
      - name: Save the image
        if: matrix.arch == 'amd64'
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built -save "$RUNNER_TEMP/image.tar"
      # The build's metadata goes with the tar: the compose job verifies
      # the loaded image against it (-verify-built) and runs that image ID.
      - name: Build metadata for the compose job
        if: matrix.arch == 'amd64'
        env:
          BAKE_METADATA: ${{ steps.build.outputs.metadata }}
        run: printf '%s\n' "$BAKE_METADATA" >"$RUNNER_TEMP/metadata.json"
      - if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/metadata.json
          retention-days: 1
          if-no-files-found: error

  # The docker check: every docker-build row passed (a failed, cancelled or
  # skipped row turns it red, so it never shows green or skipped while a row
  # failed), then the image pin check (tools/check-image-pins) after its
  # tests.
  docker:
    name: docker
    needs: docker-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every docker-build row passed
        env:
          RESULT: ${{ needs.docker-build.result }}
        run: |
          echo "docker-build: $RESULT"
          test "$RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make image-pins-test image-pins

  # The compose check (#5 part 3, #26): the template "all roles on one
  # server" with the images docker-build built and checked, never a second
  # build. It loads each amd64 image tar, verifies the loaded image against
  # its build's metadata (-verify-built) and gives Compose that image ID,
  # so nothing between the load and its use goes by tag. Then
  # scripts/compose-test.sh starts every role (tests 6, 8-14) and ./km
  # migrate runs in the template (test 7).
  compose:
    name: compose
    needs: docker-build
    # Runs also when a docker-build row failed, and then fails itself, so
    # it never shows as skipped (N16).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The template's variables for the run (.env.example). Placeholders:
    # the edge addresses are RFC 5737 and RFC 3849 documentation
    # addresses, put on the runner's loopback by compose-test.sh; the
    # database password exists only for this run.
    env:
      COMPOSE_PROFILES: control,edge,store,filter,groupware
      KEEPIA_POSTGRES_PASSWORD: compose-ci-only
      EDGE_IPV4: 192.0.2.10
      EDGE_IPV6: 2001:db8::10
    steps:
      - name: Every docker-build row passed
        env:
          RESULT: ${{ needs.docker-build.result }}
        run: |
          echo "docker-build: $RESULT"
          test "$RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sh scripts/ci-docker-mirror.sh
      # The upstream images by digest (scripts/ci-pull-images.sh reads the
      # image: lines of docker-compose.yml), with retries.
      - run: sh scripts/ci-pull-images.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Load the images
        run: |
          for name in keepia postfix unbound olefy sogo; do
            docker load -i "$RUNNER_TEMP/images/image-$name/image.tar"
          done
      # Each loaded image must be its build's output: verify compares the
      # local ID of every name with the build's digest and puts out the ID
      # (steps.<id>.outputs.image), which Compose then runs.
      - id: keepia
        run: BAKE_METADATA=$(cat "$RUNNER_TEMP/images/image-keepia/metadata.json") GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - id: postfix
        run: BAKE_METADATA=$(cat "$RUNNER_TEMP/images/image-postfix/metadata.json") GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - id: unbound
        run: BAKE_METADATA=$(cat "$RUNNER_TEMP/images/image-unbound/metadata.json") GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - id: olefy
        run: BAKE_METADATA=$(cat "$RUNNER_TEMP/images/image-olefy/metadata.json") GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - id: sogo
        run: BAKE_METADATA=$(cat "$RUNNER_TEMP/images/image-sogo/metadata.json") GOENV=off GOFLAGS=-mod=readonly GOWORK=off go run ./tools/check-image-pins -verify-built
      - name: Compose template (tests 6, 8-14)
        env:
          KEEPIA_IMAGE: ${{ steps.keepia.outputs.image }}
          KEEPIA_POSTFIX_IMAGE: ${{ steps.postfix.outputs.image }}
          KEEPIA_UNBOUND_IMAGE: ${{ steps.unbound.outputs.image }}
          KEEPIA_OLEFY_IMAGE: ${{ steps.olefy.outputs.image }}
          KEEPIA_SOGO_IMAGE: ${{ steps.sogo.outputs.image }}
        run: bash scripts/compose-test.sh
      # Test 7: km runs keepia-mail in the running template. serve has
      # applied the migrations at its start, so migrate finds none to
      # apply, and status lists version 1 as applied.
      - name: ./km migrate (test 7)
        env:
          KEEPIA_IMAGE: ${{ steps.keepia.outputs.image }}
          KEEPIA_POSTFIX_IMAGE: ${{ steps.postfix.outputs.image }}
          KEEPIA_UNBOUND_IMAGE: ${{ steps.unbound.outputs.image }}
          KEEPIA_OLEFY_IMAGE: ${{ steps.olefy.outputs.image }}
          KEEPIA_SOGO_IMAGE: ${{ steps.sogo.outputs.image }}
        run: |
          ./km migrate
          status=$(./km migrate status)
          echo "$status"
          grep -E '^00001_baseline\.sql +applied ' <<<"$status"
      # Test 7's counter-case: with a wrong database password km must fail.
      # Compose recreates postgres (same volume, so the old password
      # stays) and keepia, whose serve then cannot log in, so Docker
      # restarts keepia again and again. km's exec meets that loop (#61):
      # the step asserts each link of that chain, in the new keepia
      # container only. How the exec fails depends on where it lands in
      # the loop (#69), so scripts/km-failure-cause.sh decides by what
      # does not: km reached its exec (its sh -x trace), keepia-mail did
      # not crash (exit 2, panic), and its own error, if it printed one,
      # is SQLSTATE 28P01. Any other exec failure counts as the loop.
      - name: ./km with a wrong database password fails (test 7)
        env:
          KEEPIA_IMAGE: ${{ steps.keepia.outputs.image }}
          KEEPIA_POSTFIX_IMAGE: ${{ steps.postfix.outputs.image }}
          KEEPIA_UNBOUND_IMAGE: ${{ steps.unbound.outputs.image }}
          KEEPIA_OLEFY_IMAGE: ${{ steps.olefy.outputs.image }}
          KEEPIA_SOGO_IMAGE: ${{ steps.sogo.outputs.image }}
          KEEPIA_POSTGRES_PASSWORD: wrong-password
        run: |
          since=$(date +%s)
          rc=0
          out=$(PS4='+ ' sh -x ./km migrate status 2>&1) || rc=$?
          echo "km exited $rc: $out"
          # Why km failed: at its exec, because of keepia's restart loop.
          # Anything else, also before the exec, fails the step.
          sh scripts/km-failure-cause.sh "$rc" "$out"
          # keepia restarts because serve cannot log in. Docker counts a
          # restart, after the run's log is copied, before it reports the
          # run's "die"; the exec may have met the first run's exit before
          # that, so wait for the first "die" if none is counted yet.
          c=$(docker compose ps -aq keepia)
          if [ "$(docker inspect -f '{{.RestartCount}}' "$c")" = 0 ]; then
            timeout 120 docker events --since "$since" --filter "container=$c" --filter event=die \
              --format 'keepia exited {{index .Actor.Attributes "exitCode"}}' | head -n 1 || true
          fi
          # In the loop Docker shows keepia as running or restarting (never
          # exited): the recreated container has restarted, and its own
          # log names the wrong password (SQLSTATE 28P01).
          read -r status restarts < <(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$c")
          echo "keepia: $status, restarts $restarts"
          case $status in
          running | restarting) ;;
          *) echo "keepia is out of its restart loop"; exit 1 ;;
          esac
          test "$restarts" -gt 0
          logs=$(docker logs "$c" 2>&1)
          grep -m1 'password authentication failed.*28P01' <<<"$logs"
      - name: Stop and remove the template
        if: always()
        run: docker compose down --volumes --timeout 30
