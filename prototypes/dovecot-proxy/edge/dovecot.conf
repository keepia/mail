# Edge Dovecot for the #3 prototype: proxies IMAP, POP3, ManageSieve and LMTP
# to the store named by the routing lookup. Replaces the image's
# /etc/dovecot/dovecot.conf wholesale.
#
# The edge has NO mail storage: no mail_driver, mail_home or mail_path, and no
# userdb. lmtp_proxy reverts to local delivery for a user that is missing from
# passdb or has no `proxy` field; without storage that local delivery fails
# with a temporary error instead of storing mail on the edge (finding F3).
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

# Without listen = * the master tries [::] and stops on hosts without IPv6.
listen = *
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
state_dir = /run/dovecot
log_path = /dev/stdout

protocols = imap pop3 lmtp sieve

# Private Compose network of a prototype only; not a production setting.
ssl = no
auth_allow_cleartext = yes
auth_verbose = yes

# A routing change must take effect at the next login: no auth cache.
auth_cache_size = 0
# IMAP/POP3/ManageSieve: give up on a store after 5 s (default 30 s).
login_proxy_timeout = 5s
lmtp_proxy = yes

# Routing lookup: one line per user, extra fields after the seventh colon:
#   user:password:uid:gid:gecos:home:shell:proxy=y host=<store> nopassword=y
# nopassword=y forwards the client's password; the store checks it.
passdb passwd-file {
  passwd_file_path = /etc/dovecot/routing/routing.passwd
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# run.sh's auth-cache counter-proof (check 5) drops a file here; empty
# otherwise.
!include_try /etc/dovecot/edge.d/*.conf
