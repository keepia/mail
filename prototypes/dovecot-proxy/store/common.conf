# Mail store for the #3 prototype, shared by store-a and store-b. Replaces
# the image's /etc/dovecot/dovecot.conf wholesale (through the per-store
# dovecot.conf that includes this file).
# dovecot_config_version and dovecot_storage_version are in the per-store
# dovecot.conf: 2.4 requires dovecot_config_version as the very first setting.

listen = *
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
state_dir = /run/dovecot
log_path = /dev/stdout

protocols = imap pop3 lmtp sieve

# Private Compose network of a prototype only; not a production setting.
ssl = no
auth_allow_cleartext = yes
auth_verbose = yes

mail_driver = maildir
mail_path = ~/Maildir
mail_home = /srv/vmail/%{user | domain}/%{user | username}
mail_uid = vmail
mail_gid = vmail

# The store checks the password the edge forwards.
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users/users.passwd
}
userdb static {
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
