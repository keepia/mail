# Dovecot 2.3.21.1 writer for prototype #4: mailcow's mail_crypt, compression,
# folder-escaping and attribute settings (mailcow-dockerized tag 2026-11,
# data/conf/dovecot/dovecot.conf and docker-entrypoint.sh), nothing else.
# Paths are under /data (bind mount) instead of /var/vmail; see README.md.
protocols =
listen = 127.0.0.1
log_path = /dev/stderr
default_internal_user = vmail
default_login_user = vmail
mail_uid = vmail
mail_gid = vmail

passdb {
  driver = static
  args = password=unused
}
userdb {
  driver = static
  args = home=/data/vmail/%d/%n
}

# mailcow: maildir:/var/vmail/%d/%n/Maildir:VOLATILEDIR=/var/volatile/%u:INDEX=/var/vmail_index/%u
mail_home = /data/vmail/%d/%n
mail_location = maildir:~/Maildir:VOLATILEDIR=/data/volatile/%u:INDEX=/data/vmail_index/%u
maildir_very_dirty_syncs = yes
mail_attribute_dict = file:%h/dovecot-attributes
mail_plugins = zlib mail_crypt listescape

namespace inbox {
  inbox = yes
  separator = /
}

plugin {
  listescape_char = "\\"

  # -- Global keys (mailcow dovecot.conf:236-238)
  mail_crypt_global_private_key = </mail_crypt/ecprivkey.pem
  mail_crypt_global_public_key = </mail_crypt/ecpubkey.pem
  mail_crypt_save_version = 2

  # mailcow dovecot.conf:241
  zlib_save = lz4
}
