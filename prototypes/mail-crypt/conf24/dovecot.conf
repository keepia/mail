# Dovecot 2.4.5 reader/writer for prototype #4. The block between the
# "migration settings" markers is the 2.4 configuration for mailcow's
# mail_crypt global keys (posted on keepia/mail#4); the rest only makes the
# container run without network.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols =
listen = 127.0.0.1
log_path = /dev/stderr
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
state_dir = /run/dovecot
base_dir = /run/dovecot
mail_uid = vmail
mail_gid = vmail

passdb static {
  password = unused
}
userdb static {
  fields {
    home = /data/vmail/%{user | domain}/%{user | username}
  }
}

# --- migration settings: begin ---
mail_driver = maildir
mail_path = ~/Maildir
mail_index_path = /data/vmail_index/%{user}
mail_volatile_path = /data/volatile/%{user}
mailbox_list_layout = maildir++
maildir_very_dirty_syncs = yes
mail_attachment_detection_options =
mailbox_list_storage_escape_char = "\\"

namespace inbox {
  inbox = yes
  separator = /
}

mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}

mail_plugins {
  mail_compress = yes
  mail_crypt = yes
}
mail_compress_write_method = lz4

crypt_global_public_key_file = /mail_crypt/ecpubkey.pem
crypt_global_private_key main {
  crypt_private_key_file = /mail_crypt/ecprivkey.pem
}
# --- migration settings: end ---
